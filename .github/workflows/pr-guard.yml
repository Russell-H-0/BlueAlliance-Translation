name: pr-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  paths-and-naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查路径与命名
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/ci_check_paths.py
